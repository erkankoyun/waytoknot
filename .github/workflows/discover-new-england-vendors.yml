name: Discover Vermont Maine New Hampshire vendors
on:
  push:
    paths:
      - '.github/workflows/discover-new-england-vendors.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: new-england-vendor-discovery
  cancel-in-progress: false
jobs:
  discover:
    name: Discover ${{ matrix.state }} in 44 categories
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - state: VT
            bbox: '-73.5,42.7,-71.4,45.1'
          - state: ME
            bbox: '-71.2,42.9,-66.8,47.6'
          - state: NH
            bbox: '-72.6,42.65,-70.55,45.35'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install discovery dependencies
        run: python -m pip install -r scripts/catalog/requirements.txt
      - name: Discover all source categories within this state
        run: >-
          python scripts/catalog/discover_overture.py
          --state ${{ matrix.state }} --bbox=${{ matrix.bbox }}
          --all-source-categories --limit 0
          --output .catalog-work/candidates.jsonl
      - name: Classify using all 44 categories and deduplicate branches
        run: |
          python scripts/catalog/pipeline.py ingest .catalog-work/candidates.jsonl
          python scripts/catalog/pipeline.py status
      - name: Validate and package resumable SQL imports
        run: >-
          python scripts/catalog/prepare_state_import.py
          --db .catalog-work/queue.sqlite --state ${{ matrix.state }}
          --out-dir .catalog-work/import-${{ matrix.state }}
      - name: Publish to the existing site when its import credential is available
        env:
          CATALOG_IMPORT_TOKEN: ${{ secrets.CATALOG_IMPORT_TOKEN }}
          SITES_ACCESS_BEARER: ${{ secrets.SITES_ACCESS_BEARER }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          out=pathlib.Path('.catalog-work/import-${{ matrix.state }}')
          report=json.loads((out/'coverage.json').read_text())
          if os.environ.get('CATALOG_IMPORT_TOKEN'):
              subprocess.run(['python','scripts/catalog/pipeline.py','sync','https://waytoknot.com','--publish-unverified'],check=True)
              result={'status':'api_accepted','submitted':report['unique_candidates'],'origin':'https://waytoknot.com'}
          else:
              result={'status':'not_imported_missing_token','submitted':0,'origin':'https://waytoknot.com','reason':'CATALOG_IMPORT_TOKEN secret is missing. SQL package is ready.'}
          (out/'live-import-result.json').write_text(json.dumps(result,indent=2)+'\n')
          summary=f"### {report['state_name']}\nCandidates: {report['unique_candidates']}\nCategories searched: {report['categories_requested']}\nCategories with candidates: {report['categories_with_candidates']}\nMissing categories: {', '.join(report['missing_categories']) or 'none'}\nLive import: {result['status']}\n"
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(summary)
          PY
      - name: Save candidates coverage and tested SQL packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waytoknot-new-england-${{ matrix.state }}
          path: |
            .catalog-work/candidates.jsonl
            .catalog-work/candidates.metadata.json
            .catalog-work/queue.sqlite
            .catalog-work/import-${{ matrix.state }}/
          retention-days: 30
          if-no-files-found: error
