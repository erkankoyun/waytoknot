name: Recover legacy vendor archive
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover all 969 legacy published records
        run: python scripts/catalog/recover_legacy.py --expected 969
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: waytoknot-original-969-records
          path: .catalog-work/original-recovery.jsonl
          retention-days: 7
          if-no-files-found: error
