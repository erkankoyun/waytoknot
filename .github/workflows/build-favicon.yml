name: Build browser favicon
on:
  push:
    paths:
      - '.github/workflows/build-favicon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Create real multi-resolution favicon from existing logo
        run: |
          python - <<'PY'
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          from pathlib import Path
          p=Path('public/favicon-source-rose.png')
          image=Image.open(p).convert('RGBA')
          image.save('public/favicon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64)])
          image.resize((180,180),Image.Resampling.LANCZOS).save('public/apple-touch-icon.png')
          image.resize((192,192),Image.Resampling.LANCZOS).save('public/favicon-192.png')
          print('Created ICO, Apple touch and 192px PNG icons')
          PY
      - name: Commit generated icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/favicon.ico public/apple-touch-icon.png public/favicon-192.png
          if ! git diff --cached --quiet; then
            git commit -m "Add browser-native Way To Knot favicon assets"
            git push
          fi
