name: Prepare verified-source map contact and location patches
on:
  push:
    paths: ['.github/workflows/enrich-map-contact-locations.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: map-contact-location-enrichment
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        state: [NY, PA, VT, ME, NH, MA, FL, CT, RI, DE, MD, DC, WV, VA, NC, SC, MI, OH, IN, KY, GA, AL, TN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/catalog/requirements.txt
      - name: Read business phones street addresses and actual point geometry
        run: python scripts/catalog/enrich_overture_locations.py --state ${{ matrix.state }} --output .catalog-work/${{ matrix.state }}-locations.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: waytoknot-location-contacts-${{ matrix.state }}
          path: .catalog-work/*-locations.*
          retention-days: 30
          if-no-files-found: error
